name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://platform:test-password@localhost:5432/platform_test
      DATABASE_URL: postgresql+psycopg://platform:test-password@localhost:5432/platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check app tests
      - run: alembic upgrade head && alembic check
      - run: pytest -q
      - run: docker build -t kindred:test .
      - run: pip install pip-audit && pip-audit -r requirements.txt
